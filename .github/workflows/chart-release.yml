name: chart-release

on:
  push:
    branches:
      - main
    paths:
      - '.version-chart'

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release chart
    if: |
      ${{github.repository == 'robinlioret/gate-operator' && contains(github.event.head_commit.message, 'docs: bump chart versions to v')}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: 'v3.19.2'

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        working-directory: ./dist/chart
        run: |
          helm package . \
            --app-version $(cat ../../.version) \
            --version $(cat ../../.version-chart)

      - name: Push Helm chart to GHCR
        working-directory: ./dist/chart
        run: |
          CHART_FILE="chart-$(cat ../../.version-chart).tgz"
          OCI_URL="oci://ghcr.io/${{ github.repository }}"
          
          echo "Pushing $CHART_FILE to $OCI_URL"
          helm push "$CHART_FILE" "$OCI_URL"